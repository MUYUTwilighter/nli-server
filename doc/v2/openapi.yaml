        grant_id: {$ref: '#/components/schemas/UuidV4'}
        issuer: {$ref: '#/components/schemas/PublicAccount'}
    InstanceOwner:
      type: object
      additionalProperties: false
      required: [instance_id, owner, presented_under, publication_source, online, game_profile, compatibility, description, approval_mode, game_state, updated_at, lifecycle, config_revision, acl_revision, proxy_grant, created_at, closed_at]
      description: Owner DTO; never exposes Owner Session or Family, hit ACL Rules, Invite or Grant Secrets, lease deadlines, offline_since, or rate-limit fields.
      properties:
        instance_id: {$ref: '#/components/schemas/UuidV4'}
        owner: {$ref: '#/components/schemas/PublicAccount'}
        presented_under:
          oneOf:
            - $ref: '#/components/schemas/PublicAccount'
            - type: 'null'
        publication_source: {type: string, enum: [DIRECT, PROXY, INVITE]}
        online: {type: boolean}
        game_profile: {$ref: '#/components/schemas/ClaimedGameProfile'}
        compatibility: {$ref: '#/components/schemas/Compatibility'}
        description: {type: string, maxLength: 128}
        approval_mode: {type: string, enum: [MANUAL, AUTO]}
        game_state: {type: string, enum: [IN_WORLD, BUSY, UNKNOWN]}
        updated_at: {$ref: '#/components/schemas/UnixMillis'}
        lifecycle: {type: string, enum: [ACTIVE, CLOSED]}
        config_revision: {type: integer, format: int64, minimum: 1}
        acl_revision: {type: integer, format: int64, minimum: 1}
        proxy_grant:
          oneOf:
            - $ref: '#/components/schemas/ProxyGrantBinding'
            - type: 'null'
        created_at: {$ref: '#/components/schemas/UnixMillis'}
        closed_at: {$ref: '#/components/schemas/NullableUnixMillis'}
    InstanceOwnerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/InstanceOwner'}}
    InstanceRead:
      description: Structurally disjoint closed union; select InstanceOwner when lifecycle is present, otherwise InstanceSummary. No wire discriminator is added to the frozen REST DTO.
      oneOf:
        - $ref: '#/components/schemas/InstanceOwner'
        - $ref: '#/components/schemas/InstanceSummary'
      x-selection-rule: lifecycle present => InstanceOwner; lifecycle absent => InstanceSummary
    ProxyGrantCreateRequest:
      type: object
      additionalProperties: false
      required: [grantee_account_id]
      properties:
        grantee_account_id: {$ref: '#/components/schemas/UuidV4'}
        expires_at: {$ref: '#/components/schemas/NullableUnixMillis'}
    ProxyGrant:
      type: object
      additionalProperties: false
      required: [grant_id, grantee, status, expires_at, bound_instance_id, last_bound_at, created_at, updated_at]
      description: Issuer list metadata; never includes Secret, Hash, or Generation.
      properties:
        grant_id: {$ref: '#/components/schemas/UuidV4'}
        grantee: {$ref: '#/components/schemas/PublicAccount'}
        status: {type: string, enum: [ACTIVE, REVOKED]}
        expires_at: {$ref: '#/components/schemas/NullableUnixMillis'}
        bound_instance_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV4'
            - type: 'null'
        last_bound_at: {$ref: '#/components/schemas/NullableUnixMillis'}
        created_at: {$ref: '#/components/schemas/UnixMillis'}
        updated_at: {$ref: '#/components/schemas/UnixMillis'}
    ProxyGrantCreated:
      type: object
      additionalProperties: false
      required: [grant_id, grantee, status, expires_at, bound_instance_id, last_bound_at, created_at, updated_at, grant_secret]
      properties:
        grant_id: {$ref: '#/components/schemas/UuidV4'}
        grantee: {$ref: '#/components/schemas/PublicAccount'}
        status: {type: string, const: ACTIVE}
        expires_at: {$ref: '#/components/schemas/NullableUnixMillis'}
        bound_instance_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV4'
            - type: 'null'
        last_bound_at: {$ref: '#/components/schemas/NullableUnixMillis'}
        created_at: {$ref: '#/components/schemas/UnixMillis'}
        updated_at: {$ref: '#/components/schemas/UnixMillis'}
        grant_secret: {type: string, minLength: 32, maxLength: 4096, readOnly: true}
    ProxyGrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ProxyGrant'}}
    ProxyGrantSecret:
      type: object
      additionalProperties: false
      required: [grant_id, status, grant_secret]
      properties:
        grant_id: {$ref: '#/components/schemas/UuidV4'}
        status: {type: string, const: ACTIVE}
        grant_secret: {type: string, minLength: 32, maxLength: 4096, readOnly: true}
    InstanceProxyGrantBind:
      type: object
      additionalProperties: false
      required: [grant_secret]
      properties:
        grant_secret: {$ref: '#/components/schemas/OpaqueSecret'}
    InviteCreateRequest:
      type: object
      additionalProperties: false
      description: Both fields are optional; an explicit null is rejected. Unset expires_at defaults to 24 hours and max_uses defaults to 1.
      properties:
        expires_at: {$ref: '#/components/schemas/UnixMillis'}
        max_uses: {type: integer, minimum: 1, maximum: 100, default: 1}
    Invite:
      type: object
      additionalProperties: false
      required: [invite_id, status, expires_at, max_uses, consumed_uses, reserved_uses, created_at, last_used_at]
      description: Invite metadata; never includes Secret, Hash, or Generation.
      properties:
        invite_id: {$ref: '#/components/schemas/UuidV4'}
        status: {type: string, enum: [ACTIVE, REVOKED, EXPIRED, EXHAUSTED]}
        expires_at: {$ref: '#/components/schemas/UnixMillis'}
        max_uses: {type: integer, minimum: 1, maximum: 100}
        consumed_uses: {type: integer, minimum: 0, maximum: 100}
        reserved_uses: {type: integer, minimum: 0, maximum: 100}
        created_at: {$ref: '#/components/schemas/UnixMillis'}
        last_used_at: {$ref: '#/components/schemas/NullableUnixMillis'}
    InviteCreated:
      type: object
      additionalProperties: false
      required: [invite_id, status, expires_at, max_uses, consumed_uses, reserved_uses, created_at, last_used_at, invite_secret]
      properties:
        invite_id: {$ref: '#/components/schemas/UuidV4'}
        status: {type: string, const: ACTIVE}
        expires_at: {$ref: '#/components/schemas/UnixMillis'}
        max_uses: {type: integer, minimum: 1, maximum: 100}
        consumed_uses: {type: integer, minimum: 0, maximum: 100}
        reserved_uses: {type: integer, minimum: 0, maximum: 100}
        created_at: {$ref: '#/components/schemas/UnixMillis'}
        last_used_at: {$ref: '#/components/schemas/NullableUnixMillis'}
        invite_secret: {type: string, minLength: 32, maxLength: 4096, readOnly: true}
    InviteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Invite'}}
    InviteSecret:
      type: object
      additionalProperties: false
      required: [invite_id, status, invite_secret]
      properties:
        invite_id: {$ref: '#/components/schemas/UuidV4'}
        status: {type: string, const: ACTIVE}
        invite_secret: {type: string, minLength: 32, maxLength: 4096, readOnly: true}
    InviteResolutionRequest:
      type: object
      additionalProperties: false
      required: [invite_secret]
      properties:
        invite_secret: {$ref: '#/components/schemas/OpaqueSecret'}
    InviteResolution:
      type: object
      additionalProperties: false
      required: [invite_resolution_id, instance, expires_at]
      description: Session-bound for 60 seconds; the ID is not an independent bearer credential and reserves no invite uses.
      properties:
        invite_resolution_id: {$ref: '#/components/schemas/UuidV4'}
        instance: {$ref: '#/components/schemas/InstanceSummary'}
        expires_at: {$ref: '#/components/schemas/UnixMillis'}
    GuestProfileView:
      type: object
      additionalProperties: false
