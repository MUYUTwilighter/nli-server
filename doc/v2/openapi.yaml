      summary: Issue role-bound ICE server configuration and an independently bounded Relay grant
      description: HTTPS only, never redirected. RELAY cannot degrade to direct candidates. New Allocation activation remains bounded by allocation_create_deadline; an activated Allocation may be maintained only until the non-rolling Relay grant deadline.
      x-principal: EXACT_SIGNALING_SESSION_PARTICIPANT
