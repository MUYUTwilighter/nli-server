      properties:
        config_revision: {type: integer, format: int64, minimum: 1}
        game_profile: {$ref: '#/components/schemas/GameProfileClaimInput'}
        compatibility: {$ref: '#/components/schemas/Compatibility'}
        description: {type: string, maxLength: 128}
        approval_mode: {type: string, enum: [MANUAL, AUTO]}
        game_state: {type: string, enum: [IN_WORLD, BUSY, UNKNOWN]}
    ProxyGrantBinding:
      type: object
      additionalProperties: false
      required: [grant_id, issuer]
