      responses:
        '200':
          description: Role-bound ICE configuration. Secret replay is available only within the signaling credential issue window.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control:
              schema: {type: string, const: 'no-store'}
            Pragma:
              schema: {type: string, const: 'no-cache'}
