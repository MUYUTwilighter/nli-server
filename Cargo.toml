[package]
name = "nli-server"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"

[lib]
name = "nli_server"
path = "src/lib.rs"

[[bin]]
name = "nli-server"
path = "src/main.rs"

[features]
dependency-tests = []

[dependencies]

[dev-dependencies]
redis = { version = "1.2", default-features = false, features = ["aio", "tokio-comp"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "dependency_smoke"
path = "tests/dependency_smoke.rs"
required-features = ["dependency-tests"]
